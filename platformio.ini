; PlatformIO Project Configuration File for BrewLink
; Target: Generic ESP32 (ESP-WROOM-32 / DevKitC / Feather)
; Framework: Native ESP-IDF v6.1

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board_build.partitions = partitions.csv

; Optional native desktop environment for compiling and running host unit tests
[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -std=c++17

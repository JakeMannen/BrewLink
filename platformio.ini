; PlatformIO Project Configuration File for BrewLink
; Target: Adafruit HUZZAH32 (ESP-WROOM-32)
; Framework: Native ESP-IDF

[platformio]
default_envs = featheresp32
src_dir = src
include_dir = include

[env:featheresp32]
platform = espressif32
board = featheresp32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board_build.partitions = partitions.csv
build_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO

; Optional native desktop environment for compiling and running host unit tests
[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -std=c++17

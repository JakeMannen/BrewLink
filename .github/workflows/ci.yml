name: BrewLink PlatformIO CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.*'
      - 'dependencies.lock'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sdkconfig.*'
      - 'dependencies.lock'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    name: Test & Build Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache PlatformIO Core & Platforms
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', '**/sdkconfig.defaults', '**/partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Verify Secrets Configuration
        run: |
          if [ ! -f include/secrets.h ]; then
            echo "secrets.h not found; creating dummy secrets.h from secrets.example.h for CI build..."
            cp include/secrets.example.h include/secrets.h
          fi

      - name: Run Native Host Unit Tests
        run: |
          pio test -e native

      - name: Build Firmware (Generic ESP32 ESP-IDF)
        run: |
          pio run -e esp32dev

      - name: Upload Firmware Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brewlink-esp32dev-ci-${{ github.sha }}
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
            .pio/build/esp32dev/firmware.elf
          if-no-files-found: error
          retention-days: 14

name: BrewLink PlatformIO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core & Platforms
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', '**/sdkconfig.defaults') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Verify Secrets Configuration
        run: |
          if [ ! -f include/secrets.h ]; then
            echo "secrets.h not found; creating dummy secrets.h from secrets.example.h for CI build..."
            cp include/secrets.example.h include/secrets.h
          fi

      - name: Build Firmware (Adafruit HUZZAH32 ESP-IDF)
        run: |
          pio run -e featheresp32
